---
layout: default
---
<article class="page-content">
  <header class="post-header">
    <h1 class="post-header__title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-header__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
