{%- assign post = include.post -%}
<li class="post-card" data-category="{{ post.categories | first }}">
  <div class="post-card__meta">
    {% for cat in post.categories %}{% include tag.html category=cat %}{% endfor %}
    <span class="dot">{{ post.date | date: "%b %-d, %Y" }}</span>
    <span class="dot">{% include reading-time.html content=post.content %}</span>
  </div>
  <h2 class="post-card__title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
  <div class="post-card__excerpt">
    {{ post.excerpt | strip_html | truncatewords: 32 }}
  </div>
</li>
